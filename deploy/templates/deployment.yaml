apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-summariser
  namespace: {{ .Release.Namespace }}
  labels:
    component: file-summariser
spec:
  replicas: 1
  selector:
    matchLabels:
      component: file-summariser
  template:
    metadata:
      labels:
        component: file-summariser
        factory-plus.service: file-summariser
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: {{ .Values.scratchSize }}
        - name: pending
          persistentVolumeClaim:
            claimName: file-summariser-pending

      containers:
        - name: file-summariser
          image: {{ include "addon-file-summariser.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: api
              containerPort: {{ .Values.api.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: SERVICE_USERNAME
              value: sv1filesummariser@{{ .Values.factoryPlus.realm | required "values.factoryPlus.realm is required!" }}
            - name: SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: file-summariser-password
                  key: password
            - name: VERBOSE
              value: {{ .Values.verbosity | required "values.verbosity" }}
            - name: DIRECTORY_URL
              value: {{ .Values.factoryPlus.directoryUrl | required "values.factoryPlus.directoryUrl is required!" }}
            - name: PENDING_DIR
              value: /pending
            - name: RETENTION_HOURS
              value: {{ .Values.retentionHours | quote }}
            - name: API_PORT
              value: {{ .Values.api.port | quote }}
            - name: API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.authSecret.name }}
                  key: username
            - name: API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.authSecret.name }}
                  key: password
            - name: SCRATCH_DIR
              value: /scratch
            - name: MAX_CONCURRENT_JOBS
              value: {{ .Values.maxConcurrentJobs | quote }}
            - name: NODE_OPTIONS
              value: "--max-old-space-size={{ .Values.nodeMaxOldSpaceSizeMb }}"
          volumeMounts:
            - mountPath: /scratch
              name: scratch
            - mountPath: /pending
              name: pending
