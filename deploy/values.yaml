# -- Image pull secrets for the container image
imagePullSecrets: []

image:
  # -- The registry the image is pulled from
  registry: ghcr.io/amrc-factoryplus
  # -- The repository of the File Summariser image
  repository: addon-file-summariser
  # -- Overrides the image tag. Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

factoryPlus:
  # -- URL of the central deployment's Directory service. This is the only
  # hardcoded coordinate this add-on needs to reach Factory+: Auth, ConfigDB
  # and Files are all found afterwards via Directory-based service discovery.
  directoryUrl: ""
  # -- The Kerberos realm of the central deployment.
  realm: ""
  # -- The base URL the central deployment is served from. Used to build
  # this add-on's own krb5.conf.
  baseUrl: ""
  # -- The namespace the central deployment's Identity component (KDC/kadmin)
  # runs in. Required so this add-on's krb5.conf can reach the central KDC
  # across namespaces.
  coreNamespace: ""

api:
  # -- Port the HTTP API (polled by a dedicated acs-edge REST connection, and
  # used by admins for channel discovery) listens on inside the pod.
  port: 8080
  authSecret:
    # -- Name of a Secret, in this release's namespace, holding the HTTP
    # Basic-auth credentials the polling API requires. This add-on does not
    # create it - create it yourself, e.g.:
    #   kubectl -n <namespace> create secret generic file-summariser-api-auth \
    #     --from-literal=username=edge-agent \
    #     --from-literal=password="$(openssl rand -base64 24)"
    # Use the same username/password when configuring the REST connection
    # in the Manager. Not Factory+/Kerberos-mediated - same unmediated-access
    # posture as the InfluxDB token used to require (see the ingestion plan
    # doc in the amrc-connectivity-stack repo for why).
    name: file-summariser-api-auth
    usernameKey: username
    passwordKey: password

# -- How long a summarised point is kept, staged for delivery, before being
# pruned - in hours. Points are re-served on every poll until either they're
# picked up or this window elapses, so this is a grace period for the
# polling edge agent/MQTT being temporarily unavailable, not a guarantee.
retentionHours: 24
# -- Size of the PVC holding points staged for delivery. Downsampled data is
# small by design - see the ingestion plan doc for a sizing estimate.
pendingSize: 2Gi
# -- Storage class for the pending-points PVC. Leave empty to use the
# cluster default.
pendingStorageClass: ""

# -- Number of files to summarise concurrently. Each file is downloaded
# to local scratch storage and parsed by a worker process, so this
# directly bounds worst-case memory/CPU/disk use - keep it low.
maxConcurrentJobs: 1
# -- Size limit of the scratch volume used to hold a file while it is being summarised
scratchSize: 20Gi
# -- Node.js heap size limit in MB. Should be comfortably below resources.limits.memory
nodeMaxOldSpaceSizeMb: 512
# -- Possible values are either 1 to enable all possible debugging, or a comma-separated list of debug tags (the tags printed before the log lines). No logging is specified as an empty string.
verbosity: "ALL,!service,!token"
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 6Gi
