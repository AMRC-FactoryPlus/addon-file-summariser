name: addon-file-summariser
icon: https://www.sheffield.ac.uk/themes/custom/uos/favicon.svg
description: >
  Optional Factory+ add-on which watches ConfigDB for registered files
  (e.g. TDMS waveform captures) and writes downsampled summaries into
  InfluxDB. Installed as a standalone release into its own namespace,
  alongside an existing central AMRC Connectivity Stack deployment.
